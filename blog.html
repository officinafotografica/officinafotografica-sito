<!DOCTYPE html>
<html lang="it" class="scroll-smooth">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blog | Officina Fotografica</title>
<meta name="description" content="Il blog di Officina Fotografica: consigli di fotografia, post-produzione e video, novità dallo studio di Castellammare di Stabia.">
<link rel="canonical" href="https://www.officinafotografica.pro/blog.html">
<link rel="icon" href="assets/img/logo.png">

<script src="https://cdn.tailwindcss.com"></script>
<script src="js/tailwind-config.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>

<body data-page="blog">

<div id="site-nav"></div>

<main class="page-in">
  <section class="relative pt-44 pb-20 px-6 overflow-hidden">
    <img src="assets/img/shot-2.jpg" alt="" class="absolute inset-0 w-full h-full object-cover opacity-25" style="object-position:60% 30%">
    <div class="absolute inset-0 bg-gradient-to-b from-ink-950/70 via-ink-900/80 to-ink-900"></div>
    <div class="relative max-w-4xl mx-auto text-center">
      <p class="eyebrow mb-6">Blog</p>
      <h1 class="serif font-light text-5xl md:text-7xl text-white leading-tight mb-8">Racconti di luce</h1>
      <div class="hairline w-40 mx-auto mb-8"></div>
      <p class="serif italic font-light text-xl md:text-2xl text-gray-300 max-w-2xl mx-auto leading-relaxed">Consigli, idee e novità dallo studio.</p>
    </div>
  </section>

  <section class="py-20 px-6">
    <div id="blog-list" class="max-w-6xl mx-auto grid sm:grid-cols-2 lg:grid-cols-3 gap-8"></div>
    <p id="blog-empty" class="hidden text-center text-gray-400 serif italic text-2xl">I primi articoli arriveranno presto.</p>
  </section>
</main>

<div id="site-footer"></div>
<div id="site-extras"></div>

<script src="js/blog-data.js"></script>
<script>
(function () {
  var MESI = ['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
  var posts = (window.BLOG_POSTS || []).slice().sort(function (a, b) { return a.date < b.date ? 1 : -1; });
  var list = document.getElementById('blog-list');
  if (!posts.length) { document.getElementById('blog-empty').classList.remove('hidden'); return; }
  function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
  list.innerHTML = posts.map(function (p) {
    var d = new Date(p.date + 'T12:00:00');
    return '<a href="' + esc(p.file) + '" class="card block overflow-hidden group">' +
      '<div class="aspect-[4/3] overflow-hidden"><img src="' + esc(p.image) + '" alt="" loading="lazy" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105"></div>' +
      '<div class="p-8">' +
      '<p class="eyebrow mb-3">' + d.getDate() + ' ' + MESI[d.getMonth()] + ' ' + d.getFullYear() + '</p>' +
      '<h2 class="serif text-3xl text-white mb-3 leading-snug">' + esc(p.title) + '</h2>' +
      '<p class="text-gray-400 text-sm leading-7 mb-5">' + esc(p.excerpt) + '</p>' +
      '<span class="text-gold-400 text-[.7rem] uppercase tracking-[.25em]">Leggi <i class="fa-solid fa-arrow-right ml-1"></i></span>' +
      '</div></a>';
  }).join('');
})();
</script>
<script src="js/layout.js"></script>
<script src="js/main.js"></script>
</body>
</html>
